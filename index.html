<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#24382f">
<title>Undangan Pernikahan — Puncak Cerita Kita</title>
<style>
:root{
  --forest:#24382f;
  --moss:#627b65;
  --sage:#aab8a0;
  --cream:#f6f2e8;
  --sand:#d8c9ad;
  --ink:#26352d;
  --white:#fffdf7;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.cover{
  position:fixed;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  text-align:center;
  padding:24px;
  color:#fffdf7;
  background:
    linear-gradient(180deg,rgba(19,37,31,.35),rgba(19,37,31,.86)),
    linear-gradient(145deg,#9aab9a,#405f51 45%,#1d3029);
  transition:opacity .7s,visibility .7s;
}
.cover.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.cover h1{
  font-size:clamp(2.5rem,8vw,5rem);
  font-weight:400;
  line-height:1.02;
  margin:12px 0;
}
.cover p{
  letter-spacing:.16em;
  text-transform:uppercase;
  font:11px Arial,sans-serif;
}
.cover .names{font-size:1.15rem;margin:22px 0}
.guest-to{
  margin:8px auto 20px;
  font:12px/1.6 Arial,sans-serif;
  letter-spacing:.04em;
  color:#f4f2e8;
}
.guest-to strong{
  display:block;
  font:italic 1.2rem Georgia,serif;
  letter-spacing:0;
  margin-top:5px;
  overflow-wrap:anywhere;
}
.btn{
  border:1px solid var(--sand);
  background:var(--forest);
  color:white;
  padding:12px 20px;
  border-radius:99px;
  transition:transform .2s,background .2s;
}
.btn:hover{
  transform:translateY(-2px);
  background:var(--moss);
}
.btn.light{background:transparent;border-color:#ffffff9c}
.mountain{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.55;
  pointer-events:none;
}
.mountain path{fill:#172b24}
.mountain .back{fill:#7f9884;opacity:.7}
.cover-content{
  position:relative;
  z-index:1;
  max-width:620px;
}
.eyebrow{
  font:10px Arial,sans-serif;
  text-transform:uppercase;
  letter-spacing:.25em;
  color:var(--moss);
}
.cover .eyebrow{color:#e1e9dd}
.wrap{max-width:860px;margin:auto;padding:0 22px}
.slide{
  min-height:100svh;
  padding:90px 0 70px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid #d9d7c8;
}
.slide:nth-child(even){background:#ecefe5}
.content{
  width:100%;
  text-align:center;
  position:relative;
  z-index:1;
}
.kicker{
  font:10px Arial,sans-serif;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--moss);
}
h2{
  font-weight:400;
  font-size:clamp(2.2rem,6vw,4rem);
  line-height:1.06;
  margin:16px 0;
  color:var(--forest);
}
h3{font-size:1.4rem;font-weight:400;margin:10px 0}
.lead{
  max-width:570px;
  margin:16px auto;
  line-height:1.8;
  font-size:1.03rem;
}
.ornament{font-size:24px;color:var(--moss);margin:20px 0}
.names{font-size:clamp(1.5rem,4vw,2.3rem);line-height:1.4}
.landscape{
  width:min(100%,650px);
  height:auto;
  margin:25px auto 10px;
  display:block;
}
.date-pill{
  display:inline-block;
  border:1px solid #9aa993;
  padding:12px 20px;
  border-radius:100px;
  letter-spacing:.08em;
  font-size:12px;
  margin-top:16px;
}
.countdown{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin:25px auto;
}
.countdown div{
  min-width:76px;
  background:var(--forest);
  color:var(--white);
  padding:15px 10px;
  border-radius:8px;
}
.countdown strong{
  display:block;
  font-size:1.7rem;
  font-weight:400;
}
.countdown span{
  font:9px Arial,sans-serif;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:#d6dfd2;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  max-width:650px;
  margin:30px auto;
}
.panel{
  padding:25px 18px;
  background:#fffdf7;
  border:1px solid #d9dfd2;
  border-radius:14px;
}
.panel p{font:13px/1.7 Arial,sans-serif}
.panel p.parents{
  font:11.5px/1.55 Arial,sans-serif;
  margin:12px 0 16px;
  color:#536454;
}
.panel p.parents .parents-label{
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#71816f;
}
.panel p.parents .parents-names{font-weight:500;color:var(--ink)}
.panel h3{color:var(--forest)}
.mapbox{
  margin:20px auto;
  max-width:600px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #c9d2c4;
}
.mapbox iframe{
  width:100%;
  height:270px;
  border:0;
  display:block;
}
.form{
  max-width:520px;
  margin:25px auto;
  text-align:left;
  display:grid;
  gap:12px;
}
.form label{
  font:11px Arial,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.form input,.form select,.form textarea{
  display:block;
  width:100%;
  margin-top:6px;
  padding:12px;
  border:1px solid #c6d0c2;
  background:#fffdf7;
  border-radius:8px;
  color:var(--ink);
}
.gift{
  max-width:440px;
  margin:22px auto;
  padding:25px;
  border:1px solid #c7d2c3;
  border-radius:14px;
  background:#fffdf7;
}
.gift .account{
  font:20px Arial,sans-serif;
  letter-spacing:.08em;
  margin:16px;
}
.footer-note{font-size:13px;line-height:1.8}
.floating-music{
  position:fixed;
  right:16px;
  top:16px;
  z-index:8;
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid #d5dece;
  background:var(--forest);
  color:white;
  box-shadow:0 4px 16px #0002;
}
.bottom-nav{display:none}
.reveal{
  opacity:0;
  transform:translateY(18px);
  transition:opacity .7s ease,transform .7s ease;
}
.reveal.visible{opacity:1;transform:none}
.line{
  width:60px;
  height:1px;
  background:#94a48f;
  margin:24px auto;
}
.tiny{font:10px Arial,sans-serif;letter-spacing:.1em;color:#738170}

/* Generator tautan undangan */
.generator-page[hidden]{display:none!important}
.generator-page{
  min-height:100svh;
  padding:28px 18px;
  display:grid;
  place-items:center;
  background:var(--cream);
  font-family:Arial,sans-serif;
}
.generator-card{
  width:min(100%,620px);
  padding:clamp(22px,5vw,42px);
  border:1px solid #d9dfd2;
  border-radius:28px;
  background:#fffdf7;
  text-align:center;
  box-shadow:0 12px 36px #24382f0c;
}
.generator-card .generator-mark{
  font-size:34px;
  color:var(--moss);
  margin:18px 0;
}
.generator-card h1{
  font:clamp(2rem,7vw,3.4rem)/1.08 Georgia,serif;
  color:var(--forest);
  margin:16px 0;
}
.generator-card p{font:16px/1.7 Georgia,serif}
.generator-card label{
  display:block;
  text-align:left;
  font:12px Arial,sans-serif;
  letter-spacing:.08em;
  margin:22px 0 8px;
}
.generator-card input{
  display:block;
  width:100%;
  padding:15px;
  border:1px solid #c6d0c2;
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  font:16px Arial,sans-serif;
}
.generator-preview{
  background:#eef0e7;
  border-radius:16px;
  padding:20px;
  margin:18px 0;
  font:clamp(18px,4vw,25px) Georgia,serif;
  overflow-wrap:anywhere;
}
.generator-actions{display:grid;gap:10px;margin-top:18px}
.generator-actions .btn{width:100%;font:15px Arial,sans-serif;padding:15px}
.generator-result{
  display:none;
  text-align:left;
  margin-top:18px;
  padding:16px;
  background:#f2f4ed;
  border-radius:12px;
  overflow-wrap:anywhere;
  font:13px/1.6 Arial,sans-serif;
}
.generator-result a{color:var(--forest);word-break:break-all}

/* Kucing B&N dengan gerakan badan lembut */
.cat-home{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin:28px auto 12px;
  padding:8px 16px;
  border:0;
  background:transparent;
  color:var(--moss);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.cat-stage{
  position:relative;
  display:block;
  width:clamp(104px,17vw,132px);
  line-height:0;
  animation:catFloat 2.8s ease-in-out infinite;
  transform-origin:center bottom;
  filter:drop-shadow(0 4px 5px #24382f12);
}
.cat-home .cat-illustration{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
}
.cat-home:active .cat-stage{transform:scale(.94)}
.cat-home .cat-caption{
  font:10px Arial,sans-serif;
  letter-spacing:.1em;
  color:var(--moss);
  line-height:1.5;
}
@keyframes catFloat{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-4px) rotate(1deg)}
}
@media(max-width:600px){
  .slide{min-height:100svh;padding:75px 0 112px}
  .wrap{padding:0 18px}
  .grid{gap:10px}
  .panel{padding:20px 12px}
  .mapbox iframe{height:230px}
  .floating-music{top:12px;right:12px;bottom:auto}
  .bottom-nav{
    position:fixed;
    z-index:10;
    left:0;
    right:0;
    bottom:0;
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:4px;
    align-items:stretch;
    padding:7px 7px calc(7px + env(safe-area-inset-bottom));
    background:#f8f5ecf5;
    border-top:1px solid #d6dece;
    backdrop-filter:blur(12px);
  }
  .bottom-nav button{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    min-width:0;
    min-height:48px;
    border:1px solid transparent;
    background:transparent;
    color:#71816f;
    border-radius:12px;
    padding:5px 1px;
    font:9px Arial,sans-serif;
    white-space:nowrap;
  }
  .bottom-nav button .nav-icon{font:20px/1 Arial,sans-serif}
  .bottom-nav button .nav-label{font-size:9px;letter-spacing:-.02em}
  .bottom-nav button.active{
    background:var(--forest);
    color:#fffdf7;
    border-color:var(--forest);
    box-shadow:0 3px 10px #24382f22;
  }
  .bottom-nav button:focus-visible{outline:2px solid #8da58b;outline-offset:2px}
  .lead{font-size:.97rem}
  .countdown div{min-width:65px;padding:12px 7px}
  .countdown strong{font-size:1.45rem}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>
